<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ошибка сервера — Цифровой архив ИМТ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#8A4F9F 0%,#3a2647 50%,#00B6D2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.error-card{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
.error-card .icon{font-size:3rem;}
.error-card h2{color:#241b2e;font-weight:700;margin:.75rem 0 .5rem;}
.error-card p{color:#666;}
.btn-home{background:#00B6D2;border:none;padding:.6rem 1.5rem;font-weight:600;border-radius:8px;}
.btn-home:hover{background:#0090a8;}
</style>
</head>
<body>
<div class="error-card">
  <div class="icon">⚠️</div>
  <h2>Произошла ошибка сервера</h2>
  <p>Что-то пошло не так. Попробуйте повторить действие позже или обратитесь к администратору.</p>
  <a href="{{ url_for('index') }}" class="btn btn-home text-white">На главную</a>
</div>
</body>
</html>
